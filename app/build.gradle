plugins {
    id 'com.android.application'
    // Kotlin is built into AGP 9: the org.jetbrains.kotlin.android plugin must not be applied.
    // Compose still needs its compiler plugin, version-matched to AGP's Kotlin 2.2.10.
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

// Optional: set `qivaryn.githubToken` in gradle.properties or local.properties to
// read releases from a private repository. It is compiled into debug builds only;
// release builds always ship an empty token so a published APK never leaks one.
// Public repositories need no token at all.
def githubToken = (project.findProperty("qivaryn.githubToken") ?: "").toString()

// The app has its own release repository. `qivaryn-engine` keeps publishing the
// Python package and must never be used as the APK update feed.
def updateRepo = "usamanadim/Qivaryn_Android_app"

// Beta builds follow prereleases (for example v0.2.0-beta) as well as stable
// releases. Set `-Pqivaryn.updateChannel=stable` to build a stable-only app.
def updateChannel = (project.findProperty("qivaryn.updateChannel") ?: "beta")
    .toString().trim().toLowerCase()
if (!(updateChannel in ["stable", "beta"])) {
    throw new GradleException("qivaryn.updateChannel must be 'stable' or 'beta', not '${updateChannel}'.")
}

// Release signing is supplied outside version control. CI uses environment
// variables; local builds can use keystore.properties (git-ignored). Without
// either, assembleRelease still runs but produces an unsigned APK that Android
// will refuse to install over an existing Qivaryn installation.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    // Editors on Windows often add a UTF-8 BOM; Properties.load would then see
    // the first key as "\uFEFFstoreFile" and silently ignore it.
    def keystoreText = keystorePropertiesFile.getText("UTF-8")
    if (keystoreText.startsWith("\uFEFF")) keystoreText = keystoreText.substring(1)
    keystoreProperties.load(new StringReader(keystoreText))
}
def releaseStoreFile = System.getenv("QIVARYN_KEYSTORE_PATH")
    ?: keystoreProperties.getProperty("storeFile", "")
def releaseStorePassword = System.getenv("QIVARYN_KEYSTORE_PASSWORD")
    ?: keystoreProperties.getProperty("storePassword", "")
def releaseKeyAlias = System.getenv("QIVARYN_KEY_ALIAS")
    ?: keystoreProperties.getProperty("keyAlias", "")
def releaseKeyPassword = System.getenv("QIVARYN_KEY_PASSWORD")
    ?: keystoreProperties.getProperty("keyPassword", "")
def hasReleaseSigning = releaseStoreFile &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword &&
    rootProject.file(releaseStoreFile).exists()

// Chaquopy needs a real interpreter at build time. Default to the platform's
// conventional command so CI works, while still allowing a local override
// (`qivaryn.buildPython` in gradle.properties or -P).
def defaultBuildPython =
    System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"
def chaquopyBuildPython =
    (project.findProperty("qivaryn.buildPython") ?: defaultBuildPython).toString()

// The Python engine is compiled into the APK, so its version is fixed at build
// time. Read it from the engine's single source of truth instead of importing
// Python at runtime, which keeps the Update screen truthful and cheap.
def engineVersion = "unknown"
def engineVersionFile = file("src/main/python/__init__.py")
if (engineVersionFile.exists()) {
    def match = engineVersionFile.text =~ /__version__\s*=\s*["']([^"']+)["']/
    if (match.find()) {
        engineVersion = match.group(1)
    }
}

android {
    compileSdk 36
    namespace 'com.qivaryn.app'

    defaultConfig {
        applicationId "com.qivaryn.app"
        minSdk 26
        targetSdk 36
        // Pre-1.0 while the app targets a single platform. 1.0.0 is reserved
        // for the feature-complete, all-platforms release.
        versionCode 4
        versionName "0.1.1"

        // Source of truth for the in-app updater. Compiled in on purpose: an
        // update channel that could be retargeted at runtime would let anyone
        // redirect users to a foreign APK.
        buildConfigField "String", "UPDATE_REPO", "\"${updateRepo}\""
        buildConfigField "String", "UPDATE_CHANNEL", "\"${updateChannel}\""
        buildConfigField "String", "GITHUB_TOKEN", '""'
        buildConfigField "String", "ENGINE_VERSION", "\"${engineVersion}\""

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            buildConfigField "String", "GITHUB_TOKEN", "\"${githubToken}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // AGP 9 removed packagingOptions {}; the jniLibs settings live under packaging {} now.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        buildPython chaquopyBuildPython
        // Chaquopy 17 no longer bundles Python 3.8; the build-time Python must match.
        version = "3.11"
        pip {
            install "requests==2.31.0"
            install "tqdm==4.66.0"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.6.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.2'
    implementation 'androidx.compose.material3:material3:1.2.0'
    // Media3 muxes the video and audio tracks into one MP4. Android's own
    // MediaMuxer only stores H.264 and H.265, so VP9 and AV1 Reels need this.
    // media3-transformer already pulls in media3-muxer.
    implementation 'androidx.media3:media3-transformer:1.11.1'

    testImplementation 'junit:junit:4.13.2'
}
